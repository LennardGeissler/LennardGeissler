<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="215" viewBox="0 0 1200 215" role="img" aria-labelledby="title">
  <title id="title">Now: applied cryptography in Go, and connecting AI to real systems safely. From October 2026: privacy-preserving inference and explainable AI, where the two meet.</title>
  <defs>
    <linearGradient id="now" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="986" y1="0" x2="1014" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="left"><circle cx="991" cy="100" r="14"/></clipPath>
  </defs>
  <style>
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub   { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .cap   { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.5px; }
    .flow  { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .ring { animation: none; } .ring { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="1198" height="213" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <line x1="80" y1="48" x2="370" y2="48" stroke="#30363d" stroke-width="1.5"/>
  <text class="cap" x="400" y="53" text-anchor="middle" fill="#8b949e">NOW</text>
  <line x1="430" y1="48" x2="720" y2="48" stroke="#30363d" stroke-width="1.5"/>
  <line x1="820" y1="48" x2="900" y2="48" stroke="#30363d" stroke-width="1.5"/>
  <text class="cap" x="1000" y="53" text-anchor="middle" fill="#a78bfa">FROM OCT 2026</text>
  <line x1="1100" y1="48" x2="1180" y2="48" stroke="#30363d" stroke-width="1.5"/>

  <line x1="200" y1="100" x2="600" y2="100" stroke="url(#now)" stroke-width="2.5"/>
  <line class="flow" x1="600" y1="100" x2="976" y2="100" stroke="#a78bfa" stroke-width="2.5"/>

  <circle cx="200" cy="100" r="15" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="200" cy="100" r="6" fill="#2dd4bf"/>
  <circle cx="600" cy="100" r="15" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="600" cy="100" r="6" fill="#a78bfa"/>

  <circle class="ring" cx="1000" cy="100" r="24" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="1000" cy="100" r="25" fill="#0d1117"/>
  <circle cx="991" cy="100" r="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="1009" cy="100" r="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="1009" cy="100" r="14" fill="url(#lens)" fill-opacity="0.55" clip-path="url(#left)"/>

  <text class="title" x="200" y="152" text-anchor="middle">Applied cryptography in Go</text>
  <text class="sub" x="200" y="178" text-anchor="middle">streaming AES-GCM · TLA+</text>
  <text class="title" x="600" y="152" text-anchor="middle">AI, connected safely</text>
  <text class="sub" x="600" y="178" text-anchor="middle">MCP · OAuth 2.1</text>
  <text class="title" x="1000" y="152" text-anchor="middle">Private inference · XAI</text>
  <text class="sub" x="1000" y="178" text-anchor="middle">secret sharing · explainability</text>
</svg>
