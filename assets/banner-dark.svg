<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Lennard Geißler — building at the intersection of security and AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="396" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="924" y1="0" x2="996" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="hexmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
    <clipPath id="secClip"><circle cx="900" cy="150" r="96"/></clipPath>
  </defs>
  <style>
    .name { font: 700 58px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -0.5px; }
    .tag  { font: 400 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .meta { font: 400 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .lbl  { font: 700 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 3px; }
    .hex  { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; white-space: pre; }
    .scroll { animation: scroll 60s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes scroll { to { transform: translateY(-308px); } }
    @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scroll, .ring { animation: none; } .ring { opacity: 0; } }
  </style>

