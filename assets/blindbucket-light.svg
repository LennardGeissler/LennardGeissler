<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title">
  <title id="title">An S3 client talks plaintext to blindbucket inside your trust boundary; the storage provider only receives ciphertext.</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <marker id="headT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub   { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
    .cap   { font: 700 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.5px; fill: #59636e; }
    .edge  { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
    .hex   { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #0d9488; }
    .flow  { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="248" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <rect x="28" y="28" width="672" height="194" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text class="cap" x="52" y="56" fill="#0d9488">YOUR TRUST BOUNDARY</text>

  <rect x="56" y="80" width="230" height="96" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="title" x="171" y="121" text-anchor="middle">S3 client</text>
  <text class="sub" x="171" y="148" text-anchor="middle">aws · boto3 · rclone · mc</text>

  <line class="flow" x1="292" y1="128" x2="420" y2="128" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
  <text class="edge" x="356" y="114" text-anchor="middle">plaintext</text>

  <rect x="428" y="80" width="250" height="96" rx="12" fill="#0d9488" fill-opacity="0.10" stroke="#0d9488" stroke-width="2"/>
  <text class="title" x="553" y="121" text-anchor="middle">blindbucket</text>
  <text class="sub" x="553" y="148" text-anchor="middle">encrypts in the stream</text>
  <text class="sub" x="553" y="204" text-anchor="middle">keyring: root key → KEKs → data keys</text>

  <line class="flow" x1="684" y1="128" x2="892" y2="128" stroke="#0d9488" stroke-width="2" marker-end="url(#headT)"/>
  <text class="edge" x="800" y="114" text-anchor="middle" fill="#0d9488">ciphertext only</text>
  <text class="hex" x="804" y="152" text-anchor="middle" fill-opacity="0.8">42 4c 42 4b 9f e1 …</text>

  <rect x="900" y="80" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="title" x="1030" y="121" text-anchor="middle">Storage provider</text>
  <text class="sub" x="1030" y="148" text-anchor="middle">AWS S3 · MinIO · Garage</text>
  <text class="sub" x="1030" y="204" text-anchor="middle">never sees plaintext or keys</text>
</svg>
